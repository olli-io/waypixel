[package]
name = "waypixel"
version = "0.1.0"
edition = "2024"
description = "Minimal animated pixel-art wallpaper daemon for wlroots-type Wayland compositors"

[dependencies]
waybackend = { version = "0.10", default-features = false }
rustix = { version = "1.1", features = ["event", "fs", "mm", "net", "process", "time"] }
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "safe-encode", "std"] }
sha2 = "0.10"

[build-dependencies]
waybackend-scanner = { version = "0.10", features = ["build-script"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 0
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"
