name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag is the Cargo.toml version
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" = "$GITHUB_REF_NAME"
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev wayland-protocols
          rustup update stable
          rustup default stable
          rustup target add "$TARGET"
      - run: cargo test --locked
      # musl: a static binary, with no dependency on the glibc version
      - run: cargo build --release --locked --target "$TARGET"
      - run: cp "target/$TARGET/release/waypixel" "waypixel-${{ matrix.arch }}-linux"
      - uses: actions/upload-artifact@v4
        with:
          name: waypixel-${{ matrix.arch }}-linux
          path: waypixel-${{ matrix.arch }}-linux
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp waypixel.service dist/
          cd dist
          sha256sum waypixel-*-linux waypixel.service > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            waypixel-*-linux waypixel.service SHA256SUMS
